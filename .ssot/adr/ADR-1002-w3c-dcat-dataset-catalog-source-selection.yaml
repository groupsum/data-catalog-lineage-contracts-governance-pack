body: |-
  ## Context
  
  Governed analytics datasets need catalog metadata that can describe datasets, distributions, data services, rights, contact points, and provenance metadata.
  
  ## Decision
  
  W3C DCAT v3 is selected as the canonical authority source for dataset catalog and distribution metadata targets. The repository must curate DCAT targets separately from schema contract and processing lineage targets.
