body: |-
  ## Context
  
  Governed analytics processing needs lineage evidence for jobs, runs, input datasets, output datasets, facets, and run events.
  
  ## Decision
  
  OpenLineage is selected as the canonical authority source for processing and job lineage targets. The repository must curate OpenLineage run events, jobs, runs, inputs, outputs, datasets, and facets separately from catalog metadata and schema validation targets.
