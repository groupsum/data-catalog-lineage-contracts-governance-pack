body: |-
  ## Context
  
  Analytics systems may need interoperable event envelopes and export-schema evidence for vendor event exports such as GA4 BigQuery exports.
  
  ## Decision
  
  CloudEvents core, JSON format, and HTTP binding are selected as canonical authority sources for interoperable event envelope targets. GA4 BigQuery Export schema is selected as a vendor schema authority source for governed GA4 export table and field targets.
