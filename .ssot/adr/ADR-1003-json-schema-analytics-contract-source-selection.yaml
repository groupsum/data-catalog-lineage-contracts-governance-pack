body: |-
  ## Context
  
  Analytics payloads and exports need machine-checkable schema contracts that define payload identity, required properties, types, constraints, compatibility, and versioning.
  
  ## Decision
  
  JSON Schema 2020-12 is selected as the canonical authority source for analytics payload and export schema contract targets. The repository must curate schema identity, validation, compatibility, and versioning surfaces separately from catalog metadata and runtime lineage targets.
