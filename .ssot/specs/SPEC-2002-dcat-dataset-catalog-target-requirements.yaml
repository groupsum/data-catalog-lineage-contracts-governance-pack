body: |-
  ## Requirements
  
  DCAT targets must be curated as dataset catalog, distribution, data service, rights, contact, provenance, access, and descriptive metadata surfaces. Source curation must keep catalog metadata targets separate from schema validation and runtime lineage targets.
  
  ## Evidence
  
  The repository must retain target metadata that justifies downstream templates for dataset metadata, distribution metadata, data service metadata, rights metadata, and catalog validation evidence.
