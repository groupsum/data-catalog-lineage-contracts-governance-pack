body: |-
  ## Requirements
  
  OpenLineage targets must be curated as run event, job, run, input dataset, output dataset, dataset facet, run facet, producer, schema URL, event time, and custom facet surfaces. Source curation must keep lineage event targets separate from catalog metadata and schema validation targets.
  
  ## Evidence
  
  The repository must retain target metadata that justifies downstream templates for run event validation, dataset facet validation, input/output lineage, and processing evidence.
