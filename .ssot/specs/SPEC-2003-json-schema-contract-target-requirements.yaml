body: |-
  ## Requirements
  
  JSON Schema targets must be curated as schema identity, validation, required field, type, constraint, compatibility, deprecation, migration, and versioned reference surfaces. Source curation must preserve the selected JSON Schema dialect and keep schema contract targets separate from catalog and lineage targets.
  
  ## Evidence
  
  The repository must map JSON Schema targets to downstream templates that require schema snapshots, accepted and rejected fixture outputs, compatibility reports, and migration evidence.
